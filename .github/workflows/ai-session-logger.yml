name: AI Session Logger

on:
  push:
    paths:
      - "playwright/**/*.spec.ts"
      - "cypress/**/*.cy.ts"
      - "playwright/pages/**/*.ts"
  workflow_dispatch:
    inputs:
      session_description:
        description: "Description of AI session"
        required: true
        type: string
      agent_used:
        description: "Which agent was used"
        required: true
        type: choice
        options:
          - "skills/playwright-testing"
          - "skills/cypress-to-playwright-migration"
          - "skills/code-review"
          - "@playwright-healer"
          - "Manual"
          - "Other"

permissions:
  contents: write

jobs:
  log-session:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetch last 2 commits to compare changes

      - name: Detect changed test files
        id: changes
        run: |
          echo "## Changed Files" >> $GITHUB_STEP_SUMMARY
          git diff --name-only HEAD~1 HEAD | grep -E '\.(spec|cy)\.ts$' | tee changed_files.txt || echo "No test files changed"
          echo "files=$(cat changed_files.txt | tr '\n' ',')" >> $GITHUB_OUTPUT

      - name: Extract commit message
        id: commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          {
            echo "message<<__EOF__"
            echo "$COMMIT_MSG"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Determine agent from commit message
        id: agent
        run: |
          COMMIT_MSG="${{ steps.commit.outputs.message }}"
          AGENT="Manual"

          if [[ "$COMMIT_MSG" =~ @playwright-healer ]]; then AGENT="@playwright-healer"
          elif [[ "$COMMIT_MSG" =~ playwright-testing ]]; then AGENT="skills/playwright-testing"
          elif [[ "$COMMIT_MSG" =~ cypress-to-playwright-migration ]]; then AGENT="skills/cypress-to-playwright-migration"
          elif [[ "$COMMIT_MSG" =~ code-review ]]; then AGENT="skills/code-review"
          fi

          if [[ "${{ github.event.inputs.agent_used }}" != "" ]]; then
            AGENT="${{ github.event.inputs.agent_used }}"
          fi

          echo "name=$AGENT" >> $GITHUB_OUTPUT

      - name: Append to session log
        run: |
          SESSION_DATE=$(date '+%Y-%m-%d %H:%M UTC')
          AGENT="${{ steps.agent.outputs.name }}"
          FILES="${{ steps.changes.outputs.files }}"
          COMMIT_MSG="${{ steps.commit.outputs.message }}"

          mkdir -p .github/memory
          cat >> .github/memory/session-log.md << EOF

          ---

          ### Session: $SESSION_DATE

          **User Request**: $COMMIT_MSG

          **Agent(s) Used**: $AGENT

          **Files Modified**:
          $(echo "$FILES" | tr ',' '\n' | sed 's/^/- /')

          **Commit**: \`${{ github.sha }}\`

          **Triggered By**: ${{ github.event_name }}

          ---

          EOF

      - name: Commit session log
        run: |
          git config user.name "AI Session Logger"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/memory/session-log.md
          git commit -m "📝 Log AI session: ${{ steps.agent.outputs.name }}" || echo "No changes to commit"
          git push || echo "push skipped"

      - name: Create session summary
        run: |
          echo "## AI Session Logged" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Agent**: ${{ steps.agent.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Files Changed**: ${{ steps.changes.outputs.files }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
