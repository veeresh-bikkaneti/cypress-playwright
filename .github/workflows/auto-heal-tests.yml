name: Auto-Heal Failing Tests

on:
  workflow_run:
    # Must match hybrid-ci.yml `name:`
    workflows: ["Hybrid Test Execution"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Specific test file to heal (optional)'
        required: false
        type: string
      framework:
        description: 'Framework'
        required: true
        type: choice
        options:
          - 'playwright'
          - 'cypress'

jobs:
  detect-failures:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}
    
    outputs:
      failed_tests: ${{ steps.parse.outputs.tests }}
      framework: ${{ steps.detect.outputs.framework }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect framework
        id: detect
        run: |
          FRAMEWORK="${{ github.event.inputs.framework }}"
          if [[ "$FRAMEWORK" == "" ]]; then
            # Auto-detect from workflow artifacts or repo structure
            if [[ -d "playwright" ]]; then FRAMEWORK="playwright"; fi
            if [[ -d "cypress" ]]; then FRAMEWORK="cypress"; fi
          fi
          echo "framework=$FRAMEWORK" >> $GITHUB_OUTPUT

      - name: Download Playwright results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: playwright-results
          path: ./test-results/playwright
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download Cypress results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cypress-results
          path: ./test-results/cypress
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Parse failed tests
        id: parse
        run: |
          # Parse Playwright or Cypress output to extract failed test files
          FAILED=$(grep -rE "FAILED|failing" ./test-results 2>/dev/null | head -n 50 || true)
          FAILED=${FAILED:-"(see artifacts)"}
          
          echo "tests=$FAILED" >> $GITHUB_OUTPUT
          echo "## Failed Tests Detected" >> $GITHUB_STEP_SUMMARY
          echo "$FAILED" >> $GITHUB_STEP_SUMMARY

  create-healing-issue:
    runs-on: ubuntu-latest
    needs: detect-failures
    if: ${{ needs.detect-failures.outputs.failed_tests != '' }}
    
    steps:
      - name: Create GitHub Issue for Healing
        uses: actions/github-script@v7
        with:
          script: |
            const failedTests = `${{ needs.detect-failures.outputs.failed_tests }}`;
            const framework = `${{ needs.detect-failures.outputs.framework }}`;
            const skill = framework === 'playwright'
              ? 'skills/playwright-testing (Heal section)'
              : 'skills/cypress-to-playwright-migration';
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔧 Auto-Heal: ${failedTests.split('\n')[0]}`,
              body: `## Test Healing Request
              
              **Framework**: ${framework}
              **Skill**: \`${skill}\`
              **Failed Tests**:
              \`\`\`
              ${failedTests}
              \`\`\`
              
              **Instructions** (any enterprise coding agent):
              1. Open the repo in Copilot / Claude Code / Cursor / Grok / Codex / Gemini / OpenCode
              2. Ask: \`heal ${failedTests.split('\\n')[0]} using ${skill}\`
              3. Copilot-optional: \`@playwright-healer\` for Playwright only
              4. Review the proposed fix, apply, close this issue
              
              **Artifacts**:
              - [Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              `,
              labels: ['test-failure', 'ai-healing', framework]
            });
            
            console.log(`Created issue #${issue.data.number}`);

      - name: Post to Slack/Teams (Optional)
        run: |
          echo "🔧 Test failures detected. Healing issue created." >> $GITHUB_STEP_SUMMARY
          echo "Developer should use ${{ needs.detect-failures.outputs.framework == 'playwright' && '@playwright-healer' || '@cypress-healer' }}" >> $GITHUB_STEP_SUMMARY
